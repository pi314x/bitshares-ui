# Headers every answer carries (included by conf/nginx.container*.conf). See docs/DEPLOYMENT.md.
# nginx drops the headers of an outer block when a block adds one of its own, so each location
# that adds a header includes this file again.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
