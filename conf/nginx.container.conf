# nginx inside the image (plain HTTP on 8080, as an unprivileged user; TLS comes from a
# reverse proxy in front, or from conf/nginx.container.tls.conf).
pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # an unprivileged user writes only to /tmp
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
    sendfile   on;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        include /etc/nginx/headers.common.conf;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The page: never cached, and the policy goes on it. Every address of the app is this page.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/headers.common.conf;
            include /etc/nginx/headers.csp.conf;
        }

        # Files with a hash in their name never change: kept for a year.
        location ~ "^/[A-Za-z0-9._-]+\.[0-9a-f]{16,}\.(js|css|woff2?|png|svg|ico)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/headers.common.conf;
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/headers.common.conf;
            try_files $uri /index.html;
        }

        # A source map or a hidden file is not served.
        location ~ /\. { return 404; }
        location ~ \.map$ { return 404; }
    }
}
