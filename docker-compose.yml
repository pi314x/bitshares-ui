# BitShares Desk, built from this source and served on http://localhost:8080
#
#   docker compose up --build
#
# Plain HTTP: for the wallet put it behind HTTPS (a reverse proxy, or docker-compose.tls.yml).
# See docs/DEPLOYMENT.md.
services:
    desk:
        build: .
        image: bitshares-desk:local
        ports:
            - "8080:8080"
        restart: unless-stopped
        # a static file server needs nothing else
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
