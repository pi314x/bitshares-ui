# BitShares Desk, built from this source and served on http://localhost:8080
#
#   docker compose up --build
#
# Plain HTTP: for the wallet put it behind HTTPS (a reverse proxy, or docker-compose.tls.yml).
# See docs/DEPLOYMENT.md.
services:
    desk:
        build:
            context: .
            # shown in the footer of the left menu; a build that is not told them shows neither (docs/DEPLOYMENT.md)
            args:
                BRANCH: ${BRANCH:-container}
                GIT_REV: ${GIT_REV:-unknown}
                # a mirror of the charting library archive, if the default address is not reachable from the build host
                CHARTING_LIBRARY_URL: ${CHARTING_LIBRARY_URL:-}
        image: bitshares-desk:local
        ports:
            - "8080:8080"
        restart: unless-stopped
        # a static file server needs nothing else
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
