# The same image with TLS of its own: https://<host> (443), http only redirects to it (80).
#
# This file is complete on its own, so a tool that takes ONE compose file (Dockhand, Portainer, ...)
# can run it as it is, and the two-file form below gives the same result:
#
#   docker compose -f docker-compose.tls.yml up --build
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up --build
#
# (A file that only said what differs from docker-compose.yml was an overlay: on its own Compose
# refused it with: service "desk" has neither an image nor a build context specified.)
# scripts/check-container.sh checks that both forms mean the same. Keep this file and
# docker-compose.yml in step: what the service is (image, build, hardening) is the same in both.
#
# Put the certificate chain and the key in ./certs as fullchain.pem and privkey.pem (for
# example from Let's Encrypt). They are mounted read-only; keep the key out of the repository.
# The server runs as user 101: the key file must be readable by it (chown 101 certs/privkey.pem).
services:
    desk:
        build:
            context: .
            # shown in the footer of the left menu; a build that is not told them shows neither (docs/DEPLOYMENT.md)
            args:
                BRANCH: ${BRANCH:-container}
                GIT_REV: ${GIT_REV:-unknown}
        image: bitshares-desk:local
        command:
            ["nginx", "-c", "/etc/nginx/nginx.tls.conf", "-g", "daemon off;"]
        # replaces the 8080 of docker-compose.yml when the two files are combined
        ports: !override
            - "80:8080"
            - "443:8443"
        volumes:
            - ./certs:/certs:ro
        restart: unless-stopped
        # a static file server needs nothing else
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
